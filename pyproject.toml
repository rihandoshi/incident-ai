[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opensecops-env"
version = "0.1.0"
description = "OpenSecOpsEnv – SecOps incident response environment for RL/agent evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "OpenSecOps Contributors" }]
keywords = ["reinforcement-learning", "openenv", "secops", "incident-response", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
inference = ["openai>=1.20.0"]
dev       = ["pytest>=7.0", "httpx>=0.27.0", "pytest-asyncio>=0.23.0"]
all       = ["opensecops-env[inference,dev]"]

[project.scripts]
opensecops-serve = "opensecops_env.server.app:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["opensecops_env*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
